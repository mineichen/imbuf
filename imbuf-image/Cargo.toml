[package]
name = "imbuf-image"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Conversions between imbuf image buffers and the `image` crate, with zero-copy borrows and moves where possible."
readme = "README.md"
keywords = ["image", "buffer", "ffi", "copy-on-write"]
categories = ["multimedia::images", "graphics", "data-structures"]

[dependencies]
imbuf.workspace = true
thiserror.workspace = true
image = { version = "0.25", default-features = false }

[dev-dependencies]
assert_matches.workspace = true
testresult.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
