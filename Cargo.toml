[workspace]
resolver = "3"
members = [
  "imbuf",
  "imbuf-image",
  "imbuf-opencv",
]

[workspace.package]
authors = ["mineichen"]
edition = "2024"
rust-version = "1.88"
license = "MPL-2.0"
repository = "https://github.com/mineichen/imbuf"

[workspace.dependencies]
assert_matches = "1"
bytemuck = { version = "1", default-features = false }
imbuf = { path = "imbuf", version = "0.4.0" }
#imbuf-image = { path = "imbuf-image", version = "0.1.0" }
#imbuf-opencv = { path = "imbuf-opencv", version = "0.1.0" }
testresult = "0.4"
thiserror = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
# `is_multiple_of` is not available in the MSRV
manual_is_multiple_of = "allow"

[workspace.lints.rust]
unknown_lints = "allow"
