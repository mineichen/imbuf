[package]
name = "imbuf"
version = "0.4.0"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Image buffers that abstract over underlying storage (Vec, Arc, or custom backends). Features copy-on-write semantics for efficient memory usage."
readme = "README.md"
keywords = ["image", "buffer", "ffi", "copy-on-write"]
categories = ["multimedia::images", "graphics", "computer-vision", "data-structures"]

[dependencies]
bytemuck.workspace = true
fearless_simd.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_matches.workspace = true
# Pod primitives in tests without `unsafe impl`
bytemuck = { workspace = true, features = ["derive"] }
testresult.workspace = true

[lints]
workspace = true
